name: GSoC Issue Radar and Dashboard
on:
  workflow_dispatch:
  schedule:
    # Every weekday at 08:00 Asia/Kolkata (UTC 02:30).
    # GitHub scheduled workflows may run late and can be disabled on inactive repos.
    - cron: '30 2 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gsoc-2027-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run issue scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scan_issues.py
      - name: Build dashboard
        run: python scripts/build_dashboard.py
      - name: Commit updated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/issues.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh GSoC opportunity radar"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
